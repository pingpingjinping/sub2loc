[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub2loc"
version = "0.3.9"
description = "Local, work-aware ASS subtitle translator via an OpenAI-compatible API"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0"]

[project.scripts]
sub2loc = "sub2loc.server:main"
sub2loc-desktop = "sub2loc.desktop:main"

[tool.setuptools.package-data]
sub2loc = ["ui.html", "templates/*.txt"]

[tool.setuptools.packages.find]
include = ["sub2loc*"]
