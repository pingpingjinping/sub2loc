name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install desktop and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Core and native desktop integration tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows app
        run: python scripts/build_windows.py
      - name: Launch the actual EXE and render its native window
        env:
          PYTHONUTF8: '1'
        run: python scripts/smoke_binary.py dist/sub2loc/sub2loc.exe dist/windows-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: sub2loc-windows-x64
          path: |
            dist/sub2loc-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/windows-smoke.png
          if-no-files-found: error
          retention-days: 90
